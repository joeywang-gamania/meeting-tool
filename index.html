<body class="min-h-screen p-4 md:p-6">

  <script>
    // ===== 全域狀態變數 =====
    var GAS_API_URL = "https://script.google.com/macros/s/AKfycbzntJ33wOyOElIRPyUtPNnM8FEBFSYFhQF3rUTEIQ8v3EymO57fdJgtDoKFJIt9emw7/exec";
    var audioContext, processor, sourceNode, micStream, websocket;
    var isRecording = false;
    var isSessionReady = false;
    var fullTranscript = "";
    var currentTurnBuffer = "";
	var currentInputBuffer = ""; 

    function resetStartButton() {
      var btnStart = document.getElementById("btn-start");
      btnStart.disabled = false;
      btnStart.innerText = "▶️ 開始收音";
      btnStart.className = "flex-1 py-3.5 bg-green-600 hover:bg-green-700 text-white font-bold rounded-xl text-base md:text-lg transition shadow-lg shadow-green-900/40 active:scale-98 cursor-pointer";
    }

    function checkMicrophonePermission() {
      if (!navigator.permissions || !navigator.permissions.query) return;
      navigator.permissions.query({ name: "microphone" }).then(function (status) {
        document.getElementById("mic-perm-banner").classList.toggle("hidden", status.state !== "denied");
        status.onchange = function () {
          document.getElementById("mic-perm-banner").classList.toggle("hidden", status.state !== "denied");
        };
      }).catch(function () {});
    }
    document.addEventListener("DOMContentLoaded", checkMicrophonePermission);

    var systemStream = null;

    var recognitionZh = null;
    var recognitionKo = null;

    async function startMeeting() {
      var btnStart = document.getElementById("btn-start");
      btnStart.disabled = true;
      btnStart.innerText = "⏳ 請求麥克風權限中...";
      btnStart.className = "flex-1 py-3.5 bg-yellow-800 text-yellow-200 font-bold rounded-xl text-base md:text-lg cursor-wait animate-pulse";
      var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) {
        alert("🛑 此瀏覽器不支援即時語音辨識，請改用桌面版 Chrome。");
        resetStartButton();
        return;
     }
      try {
        var tempStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        tempStream.getTracks().forEach(function (t) { t.stop(); });
        document.getElementById("mic-perm-banner").classList.add("hidden");
        recognitionZh = new SpeechRec();
        recognitionZh.lang = "zh-TW";
        recognitionZh.continuous = true;
        recognitionZh.interimResults = true;
        recognitionZh.onresult = function (e) { handleRecognitionResult(e, "zh"); };
        recognitionZh.onerror = function (e) { console.warn("中文辨識錯誤：", e.error); };
        recognitionZh.onend = function () { if (isRecording) recognitionZh.start(); }; 

        recognitionKo = new SpeechRec();
        recognitionKo.lang = "ko-KR";
        recognitionKo.continuous = true;
        recognitionKo.interimResults = true;
        recognitionKo.onresult = function (e) { handleRecognitionResult(e, "ko"); };
        recognitionKo.onerror = function (e) { console.warn("韓文辨識錯誤：", e.error); };
        recognitionKo.onend = function () { if (isRecording) recognitionKo.start(); };
        recognitionKo.start();

        btnStart.className = "flex-1 py-3.5 bg-gray-800 text-gray-500 font-bold rounded-xl text-base md:text-lg cursor-not-allowed";
        btnStart.innerText = "🎙️ 正在收音中...";
        var btnStop = document.getElementById("btn-stop");
        btnStop.disabled = false;
        btnStop.className = "flex-1 py-3.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl text-base md:text-lg transition shadow-lg shadow-red-900/40 active:scale-98 cursor-pointer";
        document.getElementById("rec-indicator").classList.remove("hidden");
        var placeholder = document.getElementById("empty-placeholder");
        if (placeholder) placeholder.remove();
        isRecording = true;
      } catch (err) {
        console.error("即時串流啟動失敗：", err);
        resetStartButton();
        document.getElementById("mic-perm-banner").classList.remove("hidden");
        if (err.name === "NotAllowedError" || err.name === "PermissionDeniedError") {
          alert("🛑 麥克風權限被拒絕！請允許權限後重新整理網頁。");
        } else {
          alert("🛑 啟動失敗：" + (err.message || err.toString()));
        }
      }
    }
	
	var interimZh = "", interimKo = "";

	function handleRecognitionResult(event, langTag) {
	  var finalText = "";
 	  var interimText = "";
 	  for (var i = event.resultIndex; i < event.results.length; i++) {
 	    var t = event.results[i][0].transcript;
   	   if (event.results[i].isFinal) finalText += t;
   	   else interimText += t;
 	  }
 	  if (langTag === "zh") interimZh = interimText;
 	  else interimKo = interimText;
 	  updateDualLivePreview();
	  if (finalText.trim()) {
    	if (langTag === "zh") interimZh = "";
        else interimKo = "";
   	    updateDualLivePreview();
  	    translateSentence(finalText.trim(), langTag);
  	  }
    }

    function updateDualLivePreview() {
      var box = document.getElementById("transcript-container");
      var liveDiv = document.getElementById("live-original-line");
      if (!liveDiv) {
        liveDiv = document.createElement("div");
        liveDiv.id = "live-original-line";
        liveDiv.className = "bg-blue-950/40 p-3 rounded-lg border border-blue-900/60 leading-relaxed font-sans shadow-sm space-y-1";
        box.appendChild(liveDiv);
      }
      var html = "";
      if (interimZh) html += '<div class="text-blue-200">🇹🇼 ' + escapeHtml(interimZh) + ' <span class="text-gray-600 italic">…</span></div>';
      if (interimKo) html += '<div class="text-yellow-300">🇰🇷 ' + escapeHtml(interimKo) + ' <span class="text-gray-600 italic">…</span></div>';
      liveDiv.innerHTML = html || "";
      box.scrollTop = box.scrollHeight;
    }

    function clearDualLivePreview() {
      var liveDiv = document.getElementById("live-original-line");
      if (liveDiv) liveDiv.remove();
    }

    async function translateSentence(originalText, langTag) {
      clearDualLivePreview();
      try {
        var res = await fetchWithRetry(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "translateText", text: originalText })
        });
        var translatedText = (res && res.translated) || "";
        var langLabel = langTag === "ko" ? "[韓文原文]" : "[中文原文]";
        renderTranscriptPair(originalText, langTag === "ko" ? translatedText : "");
        fullTranscript += langLabel + " " + originalText + (translatedText ? "\n[翻譯] " + translatedText : "") + "\n\n";
      } catch (err) {
        console.error("翻譯失敗：", err);
        renderTranscriptPair(originalText, "");
        fullTranscript += "[原文] " + originalText + "\n\n";
      }
    }

    async function fetchWithRetry(url, options, maxRetries, retryDelayMs) {
      maxRetries = maxRetries || 3;
      retryDelayMs = retryDelayMs || 800;
      var lastErr;
      for (var attempt = 1; attempt <= maxRetries; attempt++) {
        try {
          var res = await fetch(url, options);
          return await res.json();
        } catch (err) {
          lastErr = err;
          console.warn("⚠️ 第 " + attempt + " 次呼叫後端失敗，" + (attempt < maxRetries ? (retryDelayMs / 1000) + " 秒後重試..." : "已達重試上限"), err);
          if (attempt < maxRetries) {
            await new Promise(function (resolve) { setTimeout(resolve, retryDelayMs); });
          }
        }
      }
      throw lastErr;
    }

    function renderTranscriptLine(text) {
      if (!text) return;
      var box = document.getElementById("transcript-container");
      var div = document.createElement("div");
      div.className = "bg-blue-950/40 p-3 rounded-lg border border-blue-900/60 leading-relaxed font-sans shadow-sm";
      var formatted = text
        .replace(/^韓方說[，,：:]?\s*/, '<span class="px-2 py-0.5 rounded bg-yellow-500/20 text-yellow-300 font-bold border border-yellow-500/40 mr-2">[🇰🇷 韓方]</span>')
        .replace(/^我方說[，,：:]?\s*/, '<span class="px-2 py-0.5 rounded bg-blue-500/20 text-blue-300 font-bold border border-blue-500/40 mr-2">[🇹🇼 我方]</span>');
      div.innerHTML = formatted;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function detectOriginalLanguage(text) {
      var hangulRegex = /[\uAC00-\uD7A3\u1100-\u11FF\u3130-\u318F]/;
      return hangulRegex.test(text) ? "ko" : "zh";
    }

    function escapeHtml(str) {
      var div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }
	
 	function classifyChar(ch) {
 	  if (/[\uAC00-\uD7A3\u1100-\u11FF\u3130-\u318F]/.test(ch)) return "ko";
  	 if (/[\u4E00-\u9FFF\u3400-\u4DBF]/.test(ch)) return "zh";
  	 if (/[a-zA-Z0-9\s.,!?;:'"()\-\/]/.test(ch)) return null;  
  	 return "other";  
 	}
	
	function splitOriginalBySegments(text) {
 	 if (!text) return [];
 	 var segments = [];
 	 var current = "";
 	 var currentType = null;
 	 for (var i = 0; i < text.length; i++) {
  	  var ch = text[i];
  	  var type = classifyChar(ch);
  	  if (type === null) { current += ch; continue; }  
  	  if (currentType === null) currentType = type;
 	   if (type !== currentType) {
  	    segments.push({ type: currentType, text: current });
  	    current = "";
  	    currentType = type;
  	  }
  	  current += ch;
 	 }
 	 if (current) segments.push({ type: currentType || "other", text: current });
 	 return segments;
	}

    function splitTranslationBySpeaker(text) {
      if (!text) return [];
      var regex = /(我方說|韓方說)[：:,，]?\s*/g;
      var matches = [];
      var m;
      while ((m = regex.exec(text)) !== null) {
        matches.push({ index: m.index, length: m[0].length, speaker: m[1] });
      }
      if (matches.length === 0) return [{ speaker: null, text: text }];
      var segments = [];
      if (matches[0].index > 0) {
        var leading = text.slice(0, matches[0].index).trim();
        if (leading) segments.push({ speaker: null, text: leading });
      }
      for (var i = 0; i < matches.length; i++) {
        var start = matches[i].index + matches[i].length;
        var end = (i + 1 < matches.length) ? matches[i + 1].index : text.length;
        var segText = text.slice(start, end).trim();
        if (segText) segments.push({ speaker: matches[i].speaker, text: segText });
      }
      return segments;
    }

    function renderTranscriptPair(originalText, translatedText) {
      if (!originalText && !translatedText) return;
      var box = document.getElementById("transcript-container");
      var wrapper = document.createElement("div");
      wrapper.className = "bg-blue-950/40 p-3 rounded-lg border border-blue-900/60 leading-relaxed font-sans shadow-sm space-y-2";
      var html = "";
      if (originalText) {
        var origSegments = splitOriginalBySegments(originalText);
        var origHtml = origSegments.map(function (seg) {
          var colorClass, icon;
          if (seg.type === "ko") { colorClass = "text-yellow-300"; icon = "🇰🇷"; }
          else if (seg.type === "zh") { colorClass = "text-blue-200"; icon = "🇹🇼"; }
          else { colorClass = "text-gray-500 italic"; icon = "❓"; }   // other：灰色斜體，明顯標示「不確定內容」
          return '<span class="' + colorClass + '">' + icon + ' ' + escapeHtml(seg.text) + '</span>';
        }).join(" ");
        html += '<div><span class="text-2xs text-gray-500 mr-1">[原文]</span>' + origHtml + '</div>';
      }
      if (translatedText) {
        var transSegments = splitTranslationBySpeaker(translatedText);
        var transHtml = transSegments.map(function (seg) {
          var badge;
          if (seg.speaker === "韓方說") {
            badge = '<span class="px-2 py-0.5 rounded bg-yellow-500/20 text-yellow-300 font-bold border border-yellow-500/40 mr-2 text-xs">[🇰🇷 韓方]</span>';
          } else if (seg.speaker === "我方說") {
            badge = '<span class="px-2 py-0.5 rounded bg-blue-500/20 text-blue-300 font-bold border border-blue-500/40 mr-2 text-xs">[🇹🇼 我方]</span>';
          } else {
            badge = "";
          }
          return '<div class="pl-3 border-l-2 border-gray-700 ml-1">' + badge +
                 '<span class="text-gray-100">' + escapeHtml(seg.text) + '</span></div>';
        }).join("");
        html += '<div class="space-y-1"><span class="text-2xs text-gray-500">[翻譯]</span>' + transHtml + '</div>';
      }
      wrapper.innerHTML = html;
      box.appendChild(wrapper);
      box.scrollTop = box.scrollHeight;
    }

	function updateLiveTranscriptPreview(text) {
 	 var box = document.getElementById("transcript-container");
  	 var liveDiv = document.getElementById("live-preview-line");
  	 if (!liveDiv) {
  	   liveDiv = document.createElement("div");
 	   liveDiv.id = "live-preview-line";
 	   liveDiv.className = "bg-blue-950/20 p-3 rounded-lg border border-dashed border-blue-800/50 leading-relaxed font-sans text-gray-400 italic";
 	   box.appendChild(liveDiv);
 	 }
 	 liveDiv.textContent = text + " …";
 	 box.scrollTop = box.scrollHeight;
	}

    function updateLiveOriginalPreview(text) {
      var box = document.getElementById("transcript-container");
      var liveDiv = document.getElementById("live-original-line");
      if (!liveDiv) {
        liveDiv = document.createElement("div");
        liveDiv.id = "live-original-line";
        liveDiv.className = "bg-blue-950/40 p-3 rounded-lg border border-blue-900/60 leading-relaxed font-sans shadow-sm";
        box.appendChild(liveDiv);
      }
      var segments = splitOriginalBySegments(text);
      var html = segments.map(function (seg) {
        var colorClass, icon;
        if (seg.type === "ko") { colorClass = "text-yellow-300"; icon = "🇰🇷"; }
        else if (seg.type === "zh") { colorClass = "text-blue-200"; icon = "🇹🇼"; }
        else { colorClass = "text-gray-500 italic"; icon = "❓"; }
        return '<span class="' + colorClass + '">' + icon + ' ' + escapeHtml(seg.text) + '</span>';
      }).join(" ");
      liveDiv.innerHTML = '<span class="text-2xs text-gray-500 mr-1">[原文]</span>' + html + ' <span class="text-gray-600 italic">…</span>';
      box.scrollTop = box.scrollHeight;
    }

    function clearLiveOriginalPreview() {
      var liveDiv = document.getElementById("live-original-line");
      if (liveDiv) liveDiv.remove();
    }

	function clearLiveTranscriptPreview() {
 	 var liveDiv = document.getElementById("live-preview-line");
 	 if (liveDiv) liveDiv.remove();
	}

    function stopMeeting() {
      isRecording = false;
      if (recognitionZh) { recognitionZh.onend = null; recognitionZh.stop(); }
      if (recognitionKo) { recognitionKo.onend = null; recognitionKo.stop(); }
      clearDualLivePreview();
      document.getElementById("rec-indicator").classList.add("hidden");
      var btnStop = document.getElementById("btn-stop");
      btnStop.innerText = "🔄 正在萃取待辦並產出會議紀錄...";
      btnStop.disabled = true;
      btnStop.className = "flex-1 py-3.5 bg-yellow-700 text-white font-bold rounded-xl text-base md:text-lg animate-pulse";
      finalizeMeeting();
    }

    async function finalizeMeeting() {
      var btnStop = document.getElementById("btn-stop");
      if (!fullTranscript.trim()) {
        alert("未錄製到有效語音對白，無法生成會議紀錄。");
        window.location.reload();
        return;
      }
      var todayStr = new Date().toLocaleDateString("zh-TW");
      try {
        btnStop.innerText = "🔄 正在萃取待辦事項...";
        var tasksData = await fetchWithRetry(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "extractTasks", transcript: fullTranscript })
        }, 5, 1200);  
        var tasksObj = (tasksData && tasksData.tasksObj) || [];
        renderTasks(tasksObj);
        btnStop.innerText = "🔄 正在建立 Google Doc...";
        var response = await fetchWithRetry(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "archiveOnly",
           meetingDate: todayStr,
            transcript: fullTranscript,
            tasksJsonString: JSON.stringify(tasksObj)
          })
        }, 5, 1200);
		console.log("📁 建檔除錯資訊：", response);
        if (response && response.success) {
          btnStop.innerHTML = '✅ 紀錄與 Google Doc 建立完成！<br><a href="' + response.url + '" target="_blank" class="underline text-blue-200 hover:text-white font-bold">📄 點此開啟會議紀錄</a>';
          btnStop.className = "flex-1 py-3 bg-green-800 text-white font-bold rounded-xl text-sm border border-green-600 shadow-xl";
        } else {
          alert("匯出失敗：" + (response ? response.msg : "未知錯誤"));
          btnStop.innerText = "❌ 匯出失敗";
        }
      } catch (err) {
        console.error("finalizeMeeting 失敗：", err);
        alert("匯出網路請求異常：" + err.toString() + "\n\n可以嘗試重新整理後手動重試。");
        btnStop.innerText = "❌ 匯出失敗，請重試";
        btnStop.disabled = false;
      }
    }

    function renderTasks(tasksObj) {
      var tasksBox = document.getElementById("tasks-container");
      if (!tasksBox) return;
      tasksBox.innerHTML = "";
      if (!Array.isArray(tasksObj) || tasksObj.length === 0) {
        tasksBox.innerHTML = '<div class="text-gray-500 text-center py-6">本次會議無明確待辦事項。</div>';
        return;
      }
      tasksObj.forEach(function (t) {
        var taskDiv = document.createElement("div");
        taskDiv.className = "bg-yellow-950/40 p-3 rounded-lg border border-yellow-700/50 shadow-md";
        taskDiv.innerHTML = '<div class="font-bold text-yellow-300 text-xs">' + (t.taskName || "未命名任務") + "</div>" +
          '<div class="text-2xs text-yellow-500/80 mt-1.5 flex justify-between">' +
            "<span>👤 " + (t.unit || "未定") + "</span>" +
            "<span>⏳ " + (t.dueDate || "未定") + "</span>" +
          "</div>";
        tasksBox.appendChild(taskDiv);
      });
    }
  </script>
</body>
</html>

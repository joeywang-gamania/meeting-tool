<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎙️ 會議即時翻譯與紀錄</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #070b14; color: #e2e8f0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .bg-navy-card { background-color: #121b30; }
    .border-navy-light { border-color: #22345e; }
    .pulse-rec { animation: pulseRec 1.5s infinite; }
    @keyframes pulseRec { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    .transcript-box { height: 55vh; overflow-y: auto; scroll-behavior: smooth; }
  </style>
  <link rel="icon" href="data:,">
</head>
<body class="min-h-screen p-4 md:p-6">
  <div class="max-w-6xl mx-auto space-y-5">
    <div class="flex justify-between items-center bg-navy-card p-4 md:p-5 rounded-xl border border-navy-light shadow-lg">
      <div>
        <h1 class="text-xl md:text-2xl font-bold text-blue-100 flex items-center gap-2">
          <span>🎙️</span> 會議即時翻譯與紀錄
        </h1>
        <p class="text-xs text-gray-400 mt-1">麥克風環境收音 / 韓文中譯 / 英文術語保留 / 雙向發話識別</p>
      </div>
      <a id="btn-return"
         href="https://script.google.com/a/macros/gamania.com/s/AKfycbzntJ33wOyOElIRPyUtPNnM8FEBFSYFhQF3rUTEIQ8v3EymO57fdJgtDoKFJIt9emw7/exec"
         target="_top"
         class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs md:text-sm font-bold text-white transition border border-slate-600 shadow-md active:scale-95 flex items-center gap-1 cursor-pointer">
        <span>↩</span> 返回專案追蹤
      </a>
    </div>
    <div id="mic-perm-banner" class="hidden bg-red-950/80 border border-red-500 p-4 rounded-xl shadow-2xl space-y-2">
      <div class="flex items-center gap-2 font-bold text-red-300 text-sm">
        <span>⚠️</span> 瀏覽器麥克風權限受阻
      </div>
      <p class="text-xs text-red-200 leading-relaxed">
        請點擊網址列左側的 <strong class="bg-red-900 px-1.5 py-0.5 rounded text-white">「鎖頭 🔒」</strong>，將
        <strong class="underline">麥克風 (Microphone)</strong> 開啟為 <strong>「允許」</strong>，完成後重新整理此網頁即可開始收音。
      </p>
    </div>
    <div class="flex gap-4">
      <button id="btn-start" onclick="startMeeting()" class="flex-1 py-3.5 bg-green-600 hover:bg-green-700 text-white font-bold rounded-xl text-base md:text-lg transition shadow-lg shadow-green-900/40 active:scale-98 cursor-pointer">
        ▶️ 開始收音
      </button>
      <button id="btn-stop" onclick="stopMeeting()" disabled class="flex-1 py-3.5 bg-red-950/40 text-gray-500 font-bold rounded-xl text-base md:text-lg transition border border-red-900/30 cursor-not-allowed">
        ⏹️ 結束並生成紀錄
      </button>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
      <div class="lg:col-span-2 bg-navy-card rounded-xl border border-navy-light flex flex-col shadow-xl overflow-hidden">
        <div class="bg-blue-900/30 px-4 py-3 border-b border-navy-light flex justify-between items-center">
          <span class="font-bold text-blue-200 text-sm flex items-center gap-2">
            <span>💬</span> 即時翻譯逐字稿
          </span>
          <span id="rec-indicator" class="hidden text-xs font-bold text-red-400 flex items-center gap-2">
            <span class="w-2.5 h-2.5 bg-red-500 rounded-full pulse-rec"></span> 收音分析中...
          </span>
        </div>
        <div id="transcript-container" class="transcript-box p-4 space-y-3 text-xs md:text-sm text-gray-300">
          <div id="empty-placeholder" class="text-center text-gray-500 pt-16 font-medium">
            點擊「開始收音」啟動即時聽寫與 AI 翻譯...
          </div>
        </div>
      </div>
      <div class="bg-navy-card rounded-xl border border-navy-light flex flex-col shadow-xl overflow-hidden">
        <div class="bg-yellow-900/30 px-4 py-3 border-b border-navy-light">
          <span class="font-bold text-yellow-400 text-sm flex items-center gap-2">
            <span>📝</span> 即時擷取待辦
          </span>
        </div>
        <div id="tasks-container" class="p-4 space-y-3 text-xs flex-1 overflow-y-auto">
          <div class="text-center text-gray-500 pt-16">會議結束後，AI 將自動彙整關鍵待辦與執行單位...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    var GAS_API_URL = "https://script.google.com/macros/s/AKfycbzntJ33wOyOElIRPyUtPNnM8FEBFSYFhQF3rUTEIQ8v3EymO57fdJgtDoKFJIt9emw7/exec";
    var audioContext, processor, sourceNode, micStream, websocket;
    var isRecording = false;
    var isSessionReady = false;
    var fullTranscript = "";
    var currentTurnBuffer = "";

    function resetStartButton() {
      var btnStart = document.getElementById("btn-start");
      btnStart.disabled = false;
      btnStart.innerText = "▶️ 開始收音";
      btnStart.className = "flex-1 py-3.5 bg-green-600 hover:bg-green-700 text-white font-bold rounded-xl text-base md:text-lg transition shadow-lg shadow-green-900/40 active:scale-98 cursor-pointer";
    }

    function checkMicrophonePermission() {
      if (!navigator.permissions || !navigator.permissions.query) return;
      navigator.permissions.query({ name: "microphone" }).then(function (status) {
        document.getElementById("mic-perm-banner").classList.toggle("hidden", status.state !== "denied");
        status.onchange = function () {
          document.getElementById("mic-perm-banner").classList.toggle("hidden", status.state !== "denied");
        };
      }).catch(function () {});
    }
    document.addEventListener("DOMContentLoaded", checkMicrophonePermission);

    async function startMeeting() {
      var btnStart = document.getElementById("btn-start");
      btnStart.disabled = true;
      btnStart.innerText = "⏳ 請求麥克風權限中...";
      btnStart.className = "flex-1 py-3.5 bg-yellow-800 text-yellow-200 font-bold rounded-xl text-base md:text-lg cursor-wait animate-pulse";
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert("🛑 當前網域環境未支援 Web Audio 或非安全 HTTPS 連線。");
        resetStartButton();
        return;
      }
      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        document.getElementById("mic-perm-banner").classList.add("hidden");
        var tokenRes = await fetch(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "getLiveToken" })
        });
        var tokenData = await tokenRes.json();
        if (!tokenData || !tokenData.success || !tokenData.token) {
          throw new Error("無法取得 Gemini Live 連線權杖：" + (tokenData ? tokenData.msg : "未知錯誤"));
        }
        currentToken = tokenData.token;
        tokenIssuedAt = Date.now();
        connectLiveSession(currentToken, tokenData.systemPrompt, null);
        scheduleSessionRefresh();
        audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        sourceNode = audioContext.createMediaStreamSource(micStream);
        processor = audioContext.createScriptProcessor(4096, 1, 1);
        processor.onaudioprocess = function (e) {
          if (!isRecording || !isSessionReady || !websocket || websocket.readyState !== WebSocket.OPEN) return;
          var float32 = e.inputBuffer.getChannelData(0);
          var pcm16 = floatTo16BitPCM(float32);
          var base64Audio = arrayBufferToBase64(pcm16.buffer);
          websocket.send(JSON.stringify({
            realtimeInput: { audio: { data: base64Audio, mimeType: "audio/pcm;rate=16000" } }
          }));
        };
        sourceNode.connect(processor);
        processor.connect(audioContext.destination);
        btnStart.className = "flex-1 py-3.5 bg-gray-800 text-gray-500 font-bold rounded-xl text-base md:text-lg cursor-not-allowed";
        btnStart.innerText = "🎙️ 正在收音中...";
        var btnStop = document.getElementById("btn-stop");
        btnStop.disabled = false;
        btnStop.className = "flex-1 py-3.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl text-base md:text-lg transition shadow-lg shadow-red-900/40 active:scale-98 cursor-pointer";
        document.getElementById("rec-indicator").classList.remove("hidden");
        var placeholder = document.getElementById("empty-placeholder");
        if (placeholder) placeholder.remove();
        isRecording = true;
      } catch (err) {
        console.error("即時串流啟動失敗：", err);
        resetStartButton();
        document.getElementById("mic-perm-banner").classList.remove("hidden");
        if (err.name === "NotAllowedError" || err.name === "PermissionDeniedError") {
          alert("🛑 麥克風權限已被瀏覽器封鎖！請允許麥克風權限後重新整理網頁。");
        } else {
          alert("🛑 啟動失敗：" + (err.message || err.toString()));
        }
      }
    }

    var sessionResumptionHandle = null;
    var refreshTimerId = null;
    var REFRESH_INTERVAL_MS = 9 * 60 * 1000;   // 每 9 分鐘主動重連一次（避開 10 分鐘強制重置）
    var TOKEN_LIFETIME_MS = 30 * 60 * 1000;    // 權杖有效期 30 分鐘
    var tokenIssuedAt = 0;
    var currentSystemPrompt = "";

    function connectLiveSession(token, systemPrompt, resumeHandle) {
      var MODEL_NAME = "gemini-3.1-flash-live-preview";
      var WS_URL = "wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContentConstrained?access_token=" + token;
      isSessionReady = false;
      currentSystemPrompt = systemPrompt;
      websocket = new WebSocket(WS_URL);
      websocket.onopen = function () {
        websocket.send(JSON.stringify({
          setup: {
            model: "models/" + MODEL_NAME,
            generationConfig: { responseModalities: ["AUDIO"] },
            outputAudioTranscription: {},
            systemInstruction: { parts: [{ text: systemPrompt }] },
            sessionResumption: resumeHandle ? { handle: resumeHandle } : {}
          }
        }));
      };
      websocket.onmessage = function (event) {
        var response = JSON.parse(event.data);
        if (response.setupComplete) {
          isSessionReady = true;
          return;
        }
        if (response.sessionResumptionUpdate) {
          var sru = response.sessionResumptionUpdate;
          if (sru.resumable && sru.newHandle) {
            sessionResumptionHandle = sru.newHandle;
            console.log("✅ 已更新續傳 handle");
          }
        }
        var content = response.serverContent;
        if (content && content.outputTranscription && content.outputTranscription.text) {
          currentTurnBuffer += content.outputTranscription.text;
        }
        if (content && content.turnComplete) {
          renderTranscriptLine(currentTurnBuffer.trim());
          fullTranscript += currentTurnBuffer.trim() + "\n\n";
          currentTurnBuffer = "";
        }
      };
      websocket.onerror = function (e) { console.error("WebSocket 錯誤：", e); };
      websocket.onclose = function (e) { console.log("WebSocket 已關閉：", e.code, e.reason); };
    }

    function floatTo16BitPCM(float32Array) {
      var buffer = new ArrayBuffer(float32Array.length * 2);
      var view = new DataView(buffer);
      for (var i = 0, offset = 0; i < float32Array.length; i++, offset += 2) {
        var s = Math.max(-1, Math.min(1, float32Array[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      }
      return new Int16Array(buffer);
    }

    function arrayBufferToBase64(buffer) {
      var binary = "";
      var bytes = new Uint8Array(buffer);
      var chunkSize = 0x8000;
      for (var i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
      }
      return btoa(binary);
    }

    function renderTranscriptLine(text) {
      if (!text) return;
      var box = document.getElementById("transcript-container");
      var div = document.createElement("div");
      div.className = "bg-blue-950/40 p-3 rounded-lg border border-blue-900/60 leading-relaxed font-sans shadow-sm";
      var formatted = text
        .replace(/^韓方說[，,：:]?\s*/, '<span class="px-2 py-0.5 rounded bg-yellow-500/20 text-yellow-300 font-bold border border-yellow-500/40 mr-2">[🇰🇷 韓方]</span>')
        .replace(/^我方說[，,：:]?\s*/, '<span class="px-2 py-0.5 rounded bg-blue-500/20 text-blue-300 font-bold border border-blue-500/40 mr-2">[🇹🇼 我方]</span>');
      div.innerHTML = formatted;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function stopMeeting() {
	  clearInterval(refreshTimerId);
      isRecording = false;
      if (processor) { processor.disconnect(); processor.onaudioprocess = null; }
      if (sourceNode) sourceNode.disconnect();
      if (audioContext) audioContext.close();
      if (micStream) micStream.getTracks().forEach(function (t) { t.stop(); });
      if (websocket && websocket.readyState === WebSocket.OPEN) websocket.close();
      document.getElementById("rec-indicator").classList.add("hidden");
      var btnStop = document.getElementById("btn-stop");
      btnStop.innerText = "🔄 正在萃取待辦並產出會議紀錄...";
      btnStop.disabled = true;
      btnStop.className = "flex-1 py-3.5 bg-yellow-700 text-white font-bold rounded-xl text-base md:text-lg animate-pulse";
      finalizeMeeting();
    }

    async function finalizeMeeting() {
      var btnStop = document.getElementById("btn-stop");
      if (!fullTranscript.trim()) {
        alert("未錄製到有效語音對白，無法生成會議紀錄。");
        window.location.reload();
        return;
      }
      var todayStr = new Date().toLocaleDateString("zh-TW");
      try {
        var res = await fetch(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "finalizeMeeting",
            meetingDate: todayStr,
            transcript: fullTranscript
          })
        });
        var response = await res.json();
        renderTasks(response && response.tasksObj ? response.tasksObj : []);
        if (response && response.success) {
          btnStop.innerHTML = '✅ 紀錄與 Google Doc 建立完成！<br><a href="' + response.url + '" target="_blank" class="underline text-blue-200 hover:text-white font-bold">📄 點此開啟會議紀錄</a>';
          btnStop.className = "flex-1 py-3 bg-green-800 text-white font-bold rounded-xl text-sm border border-green-600 shadow-xl";
        } else {
          alert("匯出失敗：" + (response ? response.msg : "未知錯誤"));
          btnStop.innerText = "❌ 匯出失敗";
        }
      } catch (err) {
        console.error("finalizeMeeting 失敗：", err);
        alert("匯出網路請求異常：" + err.toString());
      }
    }

    function renderTasks(tasksObj) {
      var tasksBox = document.getElementById("tasks-container");
      if (!tasksBox) return;
      tasksBox.innerHTML = "";
      if (!Array.isArray(tasksObj) || tasksObj.length === 0) {
        tasksBox.innerHTML = '<div class="text-gray-500 text-center py-6">本次會議無明確待辦事項。</div>';
        return;
      }
      tasksObj.forEach(function (t) {
        var taskDiv = document.createElement("div");
        taskDiv.className = "bg-yellow-950/40 p-3 rounded-lg border border-yellow-700/50 shadow-md";
        taskDiv.innerHTML = '<div class="font-bold text-yellow-300 text-xs">' + (t.taskName || "未命名任務") + "</div>" +
          '<div class="text-2xs text-yellow-500/80 mt-1.5 flex justify-between">' +
            "<span>👤 " + (t.unit || "未定") + "</span>" +
            "<span>⏳ " + (t.dueDate || "未定") + "</span>" +
          "</div>";
        tasksBox.appendChild(taskDiv);
      });
    }
	
	function scheduleSessionRefresh() {
 	 clearInterval(refreshTimerId);
 	 refreshTimerId = setInterval(refreshLiveSession, REFRESH_INTERVAL_MS);
	}

    async function refreshLiveSession() {
      if (!isRecording) return;
      try {
        var elapsed = Date.now() - tokenIssuedAt;
        var token;
        if (elapsed < TOKEN_LIFETIME_MS - 5 * 60 * 1000) {
          token = currentToken;
        } else {
          var tokenRes = await fetch(GAS_API_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "getLiveToken" })
          });
          var tokenData = await tokenRes.json();
          if (!tokenData || !tokenData.success || !tokenData.token) {
            console.error("背景更新權杖失敗：", tokenData);
            return;
          }
          token = tokenData.token;
          currentToken = token;
          tokenIssuedAt = Date.now();
        }
        if (websocket && websocket.readyState === WebSocket.OPEN) websocket.close();
        connectLiveSession(token, currentSystemPrompt, sessionResumptionHandle);
        console.log("🔄 已背景重連 Live session（保留對話上下文）");
      } catch (err) {
        console.error("背景重連失敗：", err);
      }
    }
  </script>
</body>
</html>
